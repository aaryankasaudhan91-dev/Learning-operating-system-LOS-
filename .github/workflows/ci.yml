name: Synapse CI

on:
  push:
    branches:
      - main
      - master
      - Version-2
  pull_request:
    branches:
      - main
      - master
      - Version-2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck across all workspaces
        run: npm run typecheck

      - name: Build website portal
        run: npm run web:build

      - name: Build backend service
        run: npm run build -w backend

      - name: Run test suite
        run: npm run test:backend
        env:
          NODE_ENV: test

  desktop-check:
    name: Verify Desktop Packaging
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile desktop bundle
        run: npm run build
