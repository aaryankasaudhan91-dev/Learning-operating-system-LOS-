<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#00FFA3" />
    </linearGradient>
    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Ambient background glow blobs -->
  <circle cx="250" cy="200" r="220" fill="#00E5FF" fill-opacity="0.07" filter="url(#ogGlow)" />
  <circle cx="950" cy="400" r="260" fill="#7C3AED" fill-opacity="0.09" filter="url(#ogGlow)" />
  <circle cx="600" cy="500" r="180" fill="#00FFA3" fill-opacity="0.05" filter="url(#ogGlow)" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100) scale(1.1)">
    <rect width="90" height="90" rx="22" fill="#0d1527" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1.5" />
    <!-- Mini emblem inside -->
    <path d="M45 70 L24 50 L24 30 L36 22 L36 42 L45 52 L45 70 Z" fill="#00E5FF" />
    <path d="M45 70 L66 50 L66 36 L54 28 L54 42 L45 52 L45 70 Z" fill="#00FFA3" />
    <circle cx="45" cy="67" r="3.5" fill="#A855F7" />
  </g>

  <!-- Brand Title -->
  <text x="220" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="2">LOS</text>
  <text x="325" y="152" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#00E5FF" letter-spacing="4">| LEARNER OS</text>

  <!-- Main Headline -->
  <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="-0.5">
    AI-Driven Adaptive Learning &amp;
  </text>
  <text x="100" y="345" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="url(#cyanPurple)" letter-spacing="-0.5">
    Cognitive Profiling Architecture
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    Continuous cognitive load balancing, neural flow chambers, and curriculum mastery.
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(100, 475)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(0,229,255,0.4)" stroke-width="1.2" />
    <circle cx="24" cy="23" r="6" fill="#00E5FF" />
    <text x="40" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#E2E8F0">Real-time Telemetry</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(124,58,237,0.4)" stroke-width="1.2" />
    <circle cx="264" cy="23" r="6" fill="#7C3AED" />
    <text x="280" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#E2E8F0">NEP 2020 Aligned</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(0,255,163,0.4)" stroke-width="1.2" />
    <circle cx="504" cy="23" r="6" fill="#00FFA3" />
    <text x="520" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#E2E8F0">AI Focus Chambers</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="200" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(245,158,11,0.4)" stroke-width="1.2" />
    <circle cx="744" cy="23" r="6" fill="#F59E0B" />
    <text x="760" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#E2E8F0">Privacy First</text>
  </g>

  <!-- Bottom status line -->
  <line x1="100" y1="570" x2="1100" y2="570" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="100" y="598" font-family="monospace" font-size="14" fill="#64748B" letter-spacing="1.5">LOS PROTOCOL // V2.4 PRODUCTION READY</text>
  <text x="1100" y="598" text-anchor="end" font-family="monospace" font-size="14" fill="#00E5FF" letter-spacing="1.5">LEARNER-OS.DEV</text>
</svg>
