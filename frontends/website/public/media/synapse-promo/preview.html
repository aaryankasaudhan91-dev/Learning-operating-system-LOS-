<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="assets/gsap.min.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#101e2b;color:#fff;overflow:hidden;font-family:system-ui}#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0}.scene{position:absolute;inset:0;width:100%;height:100%}.controls{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;gap:14px;background:#101e2be8;padding:8px 14px;z-index:10;font-size:11px}button{background:#90cafa;color:#102536;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}input{flex:1;min-width:0;accent-color:#83d9b2}</style></head><body><div id="stage"></div><div class="controls"><button id="play">Play preview</button><input id="seek" type="range" min="0" max="30" step="0.05" value="0" aria-label="Preview position"/><span id="clock">0 / 30s</span></div><script>
 const params=new URLSearchParams(location.search);const bare=params.get('controls')==='0';document.querySelector('.controls').style.display=bare?'none':'flex';window.__timelines={};const names=['start','focus','grow'];let time=0,playing=false,last=0;const panels=[];
 function resize(){document.getElementById('stage').style.transform=`scale(${Math.min(innerWidth/1920,(innerHeight-(bare?0:44))/1080)})`}addEventListener('resize',resize);resize();
 async function load(){for(const name of names){const response=await fetch(`compositions/${name}.html`);let source=await response.text();source=source.replaceAll('#root',`#${name}-root`).replace('id="root"',`id="${name}-root"`);const parsed=new DOMParser().parseFromString(source,'text/html');const template=parsed.querySelector('template');const panel=document.createElement('div');panel.className='scene';const clone=template.content.cloneNode(true);const scripts=[...clone.querySelectorAll('script')];scripts.forEach(script=>script.remove());panel.append(clone);document.getElementById('stage').append(panel);for(const script of scripts){const executable=document.createElement('script');executable.textContent='(()=>{'+script.textContent+'})();';panel.append(executable)}panels.push(panel)}seek(matchMedia('(prefers-reduced-motion: reduce)').matches?2.5:.75);if(params.get('autoplay')==='1'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){playing=true;last=performance.now();requestAnimationFrame(tick)}}
 function seek(value){time=Math.max(0,Math.min(29.99,value));panels.forEach((panel,index)=>{panel.style.display=Math.floor(time/10)===index?'block':'none';window.__timelines[names[index]]?.seek(Math.max(0,Math.min(9.99,time-index*10)),false)});document.getElementById('seek').value=String(time);document.getElementById('clock').textContent=`${Math.floor(time)} / 30s`}
 document.getElementById('seek').oninput=event=>{playing=false;document.getElementById('play').textContent='Play preview';seek(Number(event.target.value))};document.getElementById('play').onclick=()=>{if(time>29.8)seek(0);playing=!playing;last=performance.now();document.getElementById('play').textContent=playing?'Pause':'Play preview';if(playing)requestAnimationFrame(tick)};
 function tick(now){if(!playing)return;const delta=Math.min(.1,(now-last)/1000);last=now;if(time+delta>=30){seek(bare?28.8:29.99);playing=false;document.getElementById('play').textContent='Replay';return}seek(time+delta);requestAnimationFrame(tick)}void load();
 </script></body></html>
